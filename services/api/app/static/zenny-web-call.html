<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zenny web call</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(#e8f3dc, #cfe6b8 45%, #9ec27a);
      color: #1c2a16;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-size: 1.45rem; font-weight: 650; margin: 0 0 0.35rem; }
    p.lead { margin: 0 0 1.25rem; opacity: 0.8; }
    label { display: block; font-size: 0.8rem; margin: 0.7rem 0 0.3rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem 0.75rem;
      border: 1px solid #8aaa6c;
      border-radius: 0.6rem;
      background: #f7fbee;
      font-size: 1rem;
    }
    #question { margin-top: 1rem; }
    .row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.1rem;
      font-weight: 650;
      cursor: pointer;
      background: #2f5d1e;
      color: #f4ffe8;
    }
    button.secondary { background: #eef6e4; color: #2f5d1e; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status {
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 0.7rem;
      background: #f7fbee;
      min-height: 2.5rem;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    #remote { margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Call Zenny</h1>
    <p class="lead">She knows your trip. Sign in, then start a call. Allow the microphone when the browser asks.</p>
    <p id="trip" class="lead"></p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <label for="name">Name (for new accounts)</label>
    <input id="name" type="text" value="Web tester" />
    <div class="row">
      <button type="button" id="signin">Sign in</button>
      <button type="button" class="secondary" id="register">Create account</button>
    </div>
    <div class="row">
      <button type="button" id="start" disabled>Start call</button>
      <button type="button" class="secondary" id="hangup" disabled>Hang up</button>
    </div>
    <label for="question">Test Zenny's shared knowledge gateway</label>
    <input id="question" type="text" placeholder="Is Qutb Minar open now?" />
    <div class="row">
      <button type="button" class="secondary" id="ask" disabled>Ask live</button>
    </div>
    <div id="status">Sign in to check LiveKit.</div>
    <div id="remote"></div>
  </main>
  <script>
    const Livekit = window.LivekitClient;
    const statusEl = document.getElementById("status");
    let accessToken = "";
    let room = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        Authorization: "Bearer " + accessToken,
      };
    }

    async function readError(response) {
      try {
        const body = await response.json();
        return body.detail || JSON.stringify(body);
      } catch {
        return response.status + " " + response.statusText;
      }
    }

    function renderTrip(ctx) {
      const el = document.getElementById("trip");
      if (!ctx || !ctx.hasTrip) {
        el.textContent = "No saved trip yet — Zenny will not invent one.";
        return;
      }
      const stops = (ctx.focusStops || []).join(", ");
      if (ctx.focusKind === "today" && ctx.focusCity) {
        el.textContent = stops
          ? "Today in " + ctx.focusCity + ": " + stops + ". Ask her about those."
          : "Today you are in " + ctx.focusCity + ".";
        return;
      }
      if (ctx.focusKind === "upcoming" && ctx.focusCity) {
        el.textContent = "Next planned day is " + ctx.focusCity + (ctx.focusDate ? " on " + ctx.focusDate : "") + ".";
        return;
      }
      const cities = (ctx.cities || []).join(", ");
      el.textContent = cities ? "Your trip: " + cities + "." : "You have a saved trip.";
    }

    async function refreshStatus() {
      const response = await fetch("/v1/zenny/voice/status", { headers: authHeaders() });
      if (!response.ok) throw new Error(await readError(response));
      const data = await response.json();
      document.getElementById("start").disabled = !data.livekitReady;
      document.getElementById("ask").disabled = false;
      try {
        const context = await fetch("/v1/zenny/voice/context", { headers: authHeaders() });
        if (context.ok) renderTrip(await context.json());
      } catch {
        // Status still works if the trip snapshot is missing.
      }
      setStatus(
        data.knowledgeMode === "shared_gateway"
          ? "Shared gateway is ready. Ask live checks reviewed KB + allowlisted official pages. LiveKit call: " + (data.livekitReady ? "ready." : "not running.")
          : data.livekitReady
            ? "LiveKit is ready. Start a call."
            : "API is up, but LiveKit is not configured. Set LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET on the API."
      );
    }

    async function afterAuth(data) {
      accessToken = data.accessToken;
      await refreshStatus();
    }

    document.getElementById("signin").onclick = async () => {
      try {
        const response = await fetch("/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!response.ok) throw new Error(await readError(response));
        await afterAuth(await response.json());
      } catch (error) {
        setStatus(String(error.message || error));
      }
    };

    document.getElementById("register").onclick = async () => {
      try {
        const response = await fetch("/v1/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            name: document.getElementById("name").value || "Web tester",
          }),
        });
        if (!response.ok) throw new Error(await readError(response));
        await afterAuth(await response.json());
      } catch (error) {
        setStatus(String(error.message || error));
      }
    };

    async function hangUp() {
      if (room) {
        try { await room.disconnect(); } catch {}
        room = null;
      }
      document.getElementById("remote").replaceChildren();
      document.getElementById("hangup").disabled = true;
      document.getElementById("start").disabled = !accessToken;
      setStatus("Call ended.");
    }

    document.getElementById("hangup").onclick = hangUp;

    document.getElementById("ask").onclick = async () => {
      const question = document.getElementById("question").value.trim();
      if (!question) return;
      try {
        document.getElementById("ask").disabled = true;
        setStatus("Checking Zenny's reviewed knowledge and live official sources…");
        const response = await fetch("/v1/agent/message", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ text: question }),
        });
        if (!response.ok) throw new Error(await readError(response));
        const answer = await response.json();
        const sources = (answer.citations || []).map((item) => item.sourceUrl).filter(Boolean);
        setStatus(answer.reply + "\n\nConfidence: " + answer.confidence + (sources.length ? "\nSource: " + sources[0] : ""));
      } catch (error) {
        setStatus(String(error.message || error));
      } finally {
        document.getElementById("ask").disabled = false;
      }
    };

    document.getElementById("start").onclick = async () => {
      try {
        document.getElementById("start").disabled = true;
        setStatus("Asking LiveKit for a room…");
        const minted = await fetch("/v1/zenny/voice/token", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({}),
        });
        if (!minted.ok) throw new Error(await readError(minted));
        const session = await minted.json();
        room = new Livekit.Room();
        room.on(Livekit.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            const el = track.attach();
            el.autoplay = true;
            document.getElementById("remote").replaceChildren(el);
            setStatus("Zenny is in the room. Speak — you can interrupt her.");
          }
        });
        room.on(Livekit.RoomEvent.Disconnected, () => {
          setStatus("Disconnected from LiveKit.");
        });
        await room.connect(session.url, session.token);
        await room.localParticipant.setMicrophoneEnabled(true);
        document.getElementById("hangup").disabled = false;
        setStatus("Connected to " + session.room + ". Waiting for Zenny’s voice…\nIf this stays here, the agent worker is not running.");
      } catch (error) {
        document.getElementById("start").disabled = false;
        setStatus(String(error.message || error));
      }
    };
  </script>
</body>
</html>
