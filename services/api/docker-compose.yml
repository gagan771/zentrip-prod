services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zentrip
      POSTGRES_PASSWORD: zentrip
      POSTGRES_DB: zentrip
    ports:
      - "5432:5432"
    volumes:
      - zentrip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentrip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zentrip_postgres_data:
